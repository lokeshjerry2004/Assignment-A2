<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>INSECT | Collection</title>

    <link rel="stylesheet" href="style.css">

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;1,500&display=swap"
        rel="stylesheet">

</head>

<body>

    <main class="container">


        <section class="left-section">


            <header class="left-header">

                <h1 class="logo">INSECT</h1>

                <div class="search">

                    <span class="search-icon">⌕</span>

                    <input type="text" placeholder="Search...">

                </div>

            </header>



            <div class="classification">

                <h2>Classification</h2>

                <div class="details">

                    <div class="detail">

                        <span class="dot"></span>

                        <div>
                            <h3>Class:</h3>
                            <p>Insecta</p>
                        </div>

                    </div>


                    <div class="detail">

                        <span class="dot"></span>

                        <div>
                            <h3>Order:</h3>
                            <p>Coleoptera</p>
                        </div>

                    </div>


                    <div class="detail">

                        <span class="dot"></span>

                        <div>
                            <h3>Family:</h3>
                            <p>Cerambycidae</p>
                        </div>

                    </div>


                    <div class="detail">

                        <span class="dot"></span>

                        <div>
                            <h3>Sub-Family:</h3>
                            <p>Cerambycinae</p>
                        </div>

                    </div>


                    <div class="detail">

                        <span class="dot"></span>

                        <div>
                            <h3>Tribe:</h3>
                            <p>Callicromatini</p>
                        </div>

                    </div>


                    <div class="detail">

                        <span class="dot"></span>

                        <div>
                            <h3>Genus:</h3>
                            <p>Pachyteria</p>
                        </div>

                    </div>

                </div>

            </div>

        </section>



        <section class="right-section">



            <header class="right-header">

                <nav>

                    <a href="#">Home</a>

                    <a href="#">Shop</a>

                    <a href="#">About</a>

                    <a href="#">Gallery</a>

                    <a href="#">Contact</a>

                </nav>

            </header>




            <div class="product-info">

                <h1>
                    Pachyteria
                    <br>
                    equestris
                </h1>




                <div class="specifications">



                    <div class="insect-icon">

                        <img src="./Assets/insect-white.png" alt="Insect illustration">

                        <p>32 mm</p>

                    </div>


                    <div class="spec-details">



                        <div class="spec">

                            <span>⚲</span>

                            <div>

                                <p>Locality:</p>

                                <h3>Malaysia</h3>

                            </div>

                        </div>




                        <div class="spec">

                            <span>♂</span>

                            <div>

                                <p>Sex:</p>

                                <h3>Male</h3>

                            </div>

                        </div>




                        <div class="spec">

                            <img src="./Assets/ruler.png" class="ruler-icon" alt="Ruler">

                            <div>

                                <p>Size:</p>

                                <h3>32 mm / 12 mm</h3>

                            </div>

                        </div>


                    </div>

                </div>




                <h2 class="price">$5.99</h2>




                <div class="options">

                    <label>

                        <input type="checkbox">

                        <span class="toggle"></span>

                        View detailed antennae

                    </label>


                    <label>

                        <input type="checkbox">

                        <span class="toggle"></span>

                        View underside

                    </label>

                </div>




                <button class="collection-btn">

                    Add to collection

                </button>


            </div>

        </section>




        <div class="jar">

            <img src="./Assets/insect.png" alt="Pachyteria equestris inside a glass jar">



    </main>

</body>

</html>
